<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FYLL — Find the cheapest fuel nearby</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 20 L18 12 H52 V58 H10 Z' fill='%23201e1d'/%3E%3Crect x='42' y='6' width='10' height='6' fill='%23201e1d'/%3E%3Crect x='10' y='48' width='42' height='10' fill='%23ec3013'/%3E%3Crect x='22' y='18' width='8' height='26' fill='%23f3f2f2'/%3E%3Crect x='22' y='18' width='20' height='8' fill='%23f3f2f2'/%3E%3Crect x='22' y='29' width='14' height='8' fill='%23f3f2f2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
  <header class="nav">
    <div class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M10 20 L18 12 H52 V58 H10 Z" fill="#201e1d"></path>
        <rect x="42" y="6" width="10" height="6" fill="#201e1d"></rect>
        <rect x="10" y="48" width="42" height="10" fill="#ec3013"></rect>
        <rect x="22" y="18" width="8" height="26" fill="#f3f2f2"></rect>
        <rect x="22" y="18" width="20" height="8" fill="#f3f2f2"></rect>
        <rect x="22" y="29" width="14" height="8" fill="#f3f2f2"></rect>
      </svg>
      FYLL
    </div>
  </header>

  <div class="filter-bar" id="filterBar">
    <div class="seg seg-full" id="locationSeg">
      <label class="seg-opt"><input type="radio" name="locationType" value="current" checked><span>📍 Current</span></label>
      <label class="seg-opt"><input type="radio" name="locationType" value="postcode"><span>Postcode</span></label>
    </div>

    <select class="pill" id="fuelType">
      <option value="e10">E10</option>
      <option value="e5">E5</option>
      <option value="b7s">B7 Diesel</option>
      <option value="b7p">B7 Premium</option>
    </select>

    <label class="pill pill-dist">
      <input type="number" id="searchDist" value="10" min="1" max="50"><span>mi</span>
    </label>

    <select class="pill" id="sortBy">
      <option value="price">Price</option>
      <option value="distance">Distance</option>
      <option value="value">Value</option>
    </select>
  </div>

  <div class="postcode-row" id="postcodeRow" hidden>
    <input class="input" type="text" id="postcode" placeholder="e.g. CB1 1AA" autocomplete="postal-code">
  </div>

  <div class="value-row" id="valueRow" hidden>
    <label class="pill pill-value"><span>Avg MPG</span><input type="number" id="avgMpg" value="40" min="5" max="150"></label>
    <label class="pill pill-value"><span>Fill (L)</span><input type="number" id="fillLitres" value="40" min="5" max="120"></label>
  </div>

  <div class="location-status" id="locationStatus"></div>

  <div class="results" id="results"></div>
</div>

<div class="modal-overlay" id="stationModal" hidden>
  <div class="modal-sheet" id="stationModalSheet"></div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
